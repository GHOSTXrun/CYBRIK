name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # Public, client-side Supabase values (anon key is safe to expose; data is protected by RLS)
          VITE_SUPABASE_URL: https://kxlexdqsnflgcehdpqwa.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4bGV4ZHFzbmZsZ2NlaGRwcXdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMDg2MDAsImV4cCI6MjEwMDc4NDYwMH0.R2Ws3vCshfXLm7iO4YoAUbQ4m4FOXr_ACQuDXzkG1DA
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
